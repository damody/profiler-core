syntax = "proto3";
package mprofiler;

message Empty {}

message TopAppInfo {
  string package_name = 1;
  string activity = 2;
  int32 pid = 3;
}

message GetPidRequest {
  string package_name = 1;
}

message GetPidResponse {
  int32 pid = 1;
}

message RtbStreamRequest {
  int32 pid = 1;
  double interval_secs = 2;
  string mode = 3;             // "" = full, "mperf" = FPS + power only
}

message RtbDataPoint {
  uint64 timestamp_ms = 1;
  double fps = 10;
  double power_mw = 12;
  double power_ma = 13;
  double voltage_v = 14;
  double battery_temp_c = 15;
  double gpu_freq_mhz = 20;
  double gpu_loading_pct = 21;
  double bcpu_freq_mhz = 30;
  double bcpu_usage_pct = 31;
  double mcpu_freq_mhz = 32;
  double mcpu_usage_pct = 33;
  double lcpu_freq_mhz = 34;
  double lcpu_usage_pct = 35;
  repeated double cpu_freqs_mhz = 36;
  repeated double cpu_usages_pct = 37;
  double total_mips = 40;
  double game_mips = 41;
  double logical_mips = 42;
  double render_mips = 43;
  double rhi_mips = 44;
  double dsu_freq_mhz = 50;
  double dram_freq_mhz = 51;
  double vcore_v = 52;
  uint64 wss_kb = 70;
  uint64 pss_kb = 71;
  repeated float frame_times_ms = 80;
  double cpu_time_ms = 90;
  double gpu_time_ms = 91;
  double power_avg_mw = 16;    // fuel gauge moving-average power
  string process_name = 100;   // SurfaceFlinger surface name
}

// ---------------------------------------------------------------------------
// RTB Summary (post-recording statistics)
// ---------------------------------------------------------------------------

message ThreadSnapshot {
  int32 tid = 1;
  int32 tgid = 2;
  string name = 3;
  double loading_pct = 4;
  double c0_pct = 5;
  double c1_pct = 6;
  double c2_pct = 7;
  double runnable_pct = 8;
  double mips = 9;
  double mcps = 10;
  double cpi = 11;
}

message FreqBucket {
  uint64 freq_mhz = 1;
  uint32 count = 2;
  double percentage = 3;
}

message FreqDistribution {
  string component = 1;
  repeated FreqBucket buckets = 2;
}

message RtbSummaryRequest {}

message RtbSummary {
  repeated ThreadSnapshot top_threads = 1;
  repeated FreqDistribution freq_distributions = 2;
  ThreadSnapshot logical_thread = 10;
  ThreadSnapshot render_thread = 11;
  ThreadSnapshot rhi_thread = 12;
  double start_temp = 20;
  double end_temp = 21;
}

message PerfettoRequest {
  int32 pid = 1;
  string mode = 2;           // kept for backward compatibility
  int32 duration_secs = 3;
  string config_pbtxt = 4;   // when non-empty, overrides mode
}

message PerfettoResponse {
  bool success = 1;
  string message = 2;
}

message PerfettoStatus {
  enum State {
    IDLE = 0;
    RECORDING = 1;
    DONE = 3;
    ERROR = 4;
  }
  State state = 1;
  double progress_pct = 2;
  string output_path = 3;
}

message PullFileRequest {
  string remote_path = 1;
}

message FileChunk {
  bytes data = 1;
  bool is_last = 2;
}

message StopResponse {
  bool success = 1;
  repeated string output_files = 3;
}

message HealthResponse {
  string version = 1;
  string status = 2;
}

message ShutdownResponse {
  bool success = 1;
}

// ---------------------------------------------------------------------------
// Package Management
// ---------------------------------------------------------------------------

message ListPackagesRequest {
  bool third_party_only = 1;
}

message PackageInfo {
  string package_name = 1;
  string apk_path = 2;
  string version_name = 3;
  int32 version_code = 4;
  int32 pid = 5;
}

message PackageList {
  repeated PackageInfo packages = 1;
}

message PackageRequest {
  string package_name = 1;
}

message GenericResponse {
  bool success = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// Shell
// ---------------------------------------------------------------------------

message ShellRequest {
  string command = 1;
}

message ShellResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}

// ---------------------------------------------------------------------------
// Screen & Input
// ---------------------------------------------------------------------------

message ScreenSizeResponse {
  int32 width = 1;
  int32 height = 2;
}

message ScreenshotRequest {
  int32 quality = 1;
}

message InputTapRequest {
  int32 x = 1;
  int32 y = 2;
}

message InputSwipeRequest {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
  int32 duration_ms = 5;
}

message InputTextRequest {
  string text = 1;
}

message InputKeyEventRequest {
  int32 key_code = 1;
}

// ---------------------------------------------------------------------------
// File Push (PC → device)
// ---------------------------------------------------------------------------

message FileUploadChunk {
  string remote_path = 1;
  bytes data = 2;
  bool is_last = 3;
}

message PushFileResponse {
  bool success = 1;
  uint64 bytes_written = 2;
}

// ---------------------------------------------------------------------------
// Device Utilities
// ---------------------------------------------------------------------------

message DevicePropRequest {
  string prop_name = 1;
}

message DevicePropResponse {
  string value = 1;
}

message PathExistsRequest {
  string path = 1;
}

message PathExistsResponse {
  bool exists = 1;
}

message InstallApkRequest {
  string remote_apk_path = 1;
}

// ---------------------------------------------------------------------------
// Temperature
// ---------------------------------------------------------------------------

message TemperatureResponse {
  double battery_temp_c = 1;
  double board_temp_c = 2;
  uint32 battery_level_pct = 3;
}

// ---------------------------------------------------------------------------
// Surface Names
// ---------------------------------------------------------------------------

message GetSurfaceNamesRequest {
  string package_name = 1;
}

message GetSurfaceNamesResponse {
  repeated string surface_names = 1;
}

// ---------------------------------------------------------------------------
// Charging Control
// ---------------------------------------------------------------------------

message SetChargingRequest {
  bool enable = 1;
}

// ---------------------------------------------------------------------------
// File Operations
// ---------------------------------------------------------------------------

message RemoveFileRequest {
  string path = 1;
}

message CreateArchiveRequest {
  string working_directory = 1;
  string target = 2;
  string output_path = 3;
}

message ExtractArchiveRequest {
  string working_directory = 1;
  string archive_path = 2;
}

message ChmodRequest {
  string path = 1;
  string mode = 2;
  bool recursive = 3;
}

message ChownRequest {
  string path = 1;
  int32 uid = 2;
  int32 gid = 3;
  bool recursive = 4;
}

message GetFileOwnerRequest {
  string path = 1;
}

message GetFileOwnerResponse {
  int32 uid = 1;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service ProfilerService {
  // Existing RPCs
  rpc Health(Empty) returns (HealthResponse);
  rpc GetTopApp(Empty) returns (TopAppInfo);
  rpc GetPid(GetPidRequest) returns (GetPidResponse);
  rpc StartRtbStream(RtbStreamRequest) returns (stream RtbDataPoint);
  rpc StartPerfetto(PerfettoRequest) returns (PerfettoResponse);
  rpc GetPerfettoStatus(Empty) returns (PerfettoStatus);
  rpc PullFile(PullFileRequest) returns (stream FileChunk);
  rpc StopRecording(Empty) returns (StopResponse);
  rpc GetRtbSummary(RtbSummaryRequest) returns (RtbSummary);
  rpc Shutdown(Empty) returns (ShutdownResponse);

  // Package Management
  rpc ListPackages(ListPackagesRequest) returns (PackageList);
  rpc GetPackageInfo(PackageRequest) returns (PackageInfo);
  rpc LaunchApp(PackageRequest) returns (GenericResponse);
  rpc StopApp(PackageRequest) returns (GenericResponse);
  rpc InstallApk(InstallApkRequest) returns (GenericResponse);

  // Shell
  rpc Shell(ShellRequest) returns (ShellResponse);

  // Screen & Input
  rpc GetScreenSize(Empty) returns (ScreenSizeResponse);
  rpc Screenshot(ScreenshotRequest) returns (stream FileChunk);
  rpc InputTap(InputTapRequest) returns (GenericResponse);
  rpc InputSwipe(InputSwipeRequest) returns (GenericResponse);
  rpc InputText(InputTextRequest) returns (GenericResponse);
  rpc InputKeyEvent(InputKeyEventRequest) returns (GenericResponse);

  // File Push
  rpc PushFile(stream FileUploadChunk) returns (PushFileResponse);

  // Device Utilities
  rpc GetDeviceProp(DevicePropRequest) returns (DevicePropResponse);
  rpc PathExists(PathExistsRequest) returns (PathExistsResponse);

  // Temperature
  rpc GetTemperature(Empty) returns (TemperatureResponse);

  // Surface Names
  rpc GetSurfaceNames(GetSurfaceNamesRequest) returns (GetSurfaceNamesResponse);

  // Charging Control
  rpc SetCharging(SetChargingRequest) returns (GenericResponse);

  // File Operations
  rpc RemoveFile(RemoveFileRequest) returns (GenericResponse);
  rpc CreateArchive(CreateArchiveRequest) returns (GenericResponse);
  rpc ExtractArchive(ExtractArchiveRequest) returns (GenericResponse);
  rpc Chmod(ChmodRequest) returns (GenericResponse);
  rpc Chown(ChownRequest) returns (GenericResponse);
  rpc GetFileOwner(GetFileOwnerRequest) returns (GetFileOwnerResponse);
}
